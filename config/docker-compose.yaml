services:
  examples:
    image: task_manager
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
      - ./maps:/maps:ro
      
    environment:
      - GEORG_MAP_DIR=/maps
      - GEORG_DEFAULT_MAP=Nav_Test.yaml
      - MISSION_ID=2

    privileged: true
    init: true
    command: ros2 launch /config/task_manager.launch.py
    # command: sleep 1d

networks:
  pib-network:
    driver: bridge
